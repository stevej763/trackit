worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile    on;
  tcp_nopush  on;
  access_log  /dev/stdout;
  error_log   /dev/stderr warn;

  gzip             on;
  gzip_min_length  1024;
  gzip_types       text/css text/plain application/javascript application/json image/svg+xml;

  server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    include /etc/nginx/security-headers.conf;

    # The SPA and the API are one origin, so the session cookie is first-party
    # and there is no CORS configuration anywhere in this project.
    location /api/ {
      proxy_pass         http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      # Overwritten rather than appended to: Spring reads the left-most
      # address, and sign-in throttling counts by it, so a client mustn't be
      # able to supply its own. Behind another proxy that terminates TLS, use
      # the realip module to recover the client address before this point.
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-Host  $host;
      # Spring would prefer these to the ones above, so drop any a client sent.
      proxy_set_header   Forwarded         "";
      proxy_set_header   X-Forwarded-Port  "";
      proxy_set_header   X-Forwarded-Prefix "";
      # Client Cookie and X-XSRF-TOKEN headers pass through untouched.

      # Spring Security sets these too; security-headers.conf is the one copy.
      proxy_hide_header  X-Content-Type-Options;
      proxy_hide_header  X-Frame-Options;
    }

    # Vite fingerprints these filenames, so they can be cached hard.
    location /assets/ {
      try_files  $uri =404;
      expires    1y;
      add_header Cache-Control "public, immutable";
      include    /etc/nginx/security-headers.conf;
    }

    # The shell must never be cached, or a deploy leaves stale asset references.
    location = /index.html {
      add_header Cache-Control "no-store";
      include    /etc/nginx/security-headers.conf;
    }

    # Client-side routes (/add, /stats, /item/12) are served the shell.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
