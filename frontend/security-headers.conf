# Included by every location in nginx.conf that sets a header of its own:
# nginx drops inherited add_header directives from any block that has one.
#
# The CSP allows images from anywhere over http(s), because hand-typed titles
# take artwork from any address; everything else is this origin only. React's
# style props go through the CSSOM, which style-src doesn't govern, so no
# 'unsafe-inline' is needed for them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: http: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# Artwork is fetched from TMDB, IGDB and wherever a hand-typed title points;
# none of them need to know which page of yours asked.
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
